<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поездки Плюс — Умный конструктор путешествий</title>
    <!-- Мета-теги для красивой ссылки в мессенджерах -->
    <meta property="og:title" content="✈️ Поездки Плюс — конструктор идеального отпуска">
    <meta property="og:description" content="Билеты, отели и поезда в одном клике. Без наценок и переплат.">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 15px; color: #1c252e; }
        .app-container { max-width: 800px; margin: 0 auto; }
        
        /* Шапка с названием бренда */
        .header { text-align: center; margin-bottom: 20px; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(26,115,232,0.2); }
        .header h1 { margin: 0 0 8px 0; font-size: 26px; font-weight: 800; }
        .header p { margin: 0; font-size: 14px; opacity: 0.9; }

        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
        
        .quick-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .chip { background: #eef4ff; color: #1a73e8; border: 1px solid #d0e1fd; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .chip:hover { background: #1a73e8; color: white; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
        
        label { font-size: 12px; font-weight: 700; color: #637381; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        input[type="text"], input[type="date"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #dfe3e8; border-radius: 10px; font-size: 15px; outline: none; background: #fafbfd; }

        .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .service-label { background: #fafbfd; border: 1px solid #dfe3e8; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .service-label input { width: 18px; height: 18px; accent-color: #1a73e8; }

        .btn-main { width: 100%; background: #1a73e8; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(26,115,232,0.3); }

        .weather-box { background: #fff8e1; border: 1px solid #ffe082; padding: 12px 15px; border-radius: 10px; font-size: 14px; color: #795548; margin-bottom: 15px; font-weight: 600; }
        .result-card { background: white; border-radius: 12px; border: 1px solid #e7ecf0; border-left: 5px solid #00ab55; padding: 16px; margin-top: 12px; }
        .badge-deal { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; margin-bottom: 8px; }
        .card-title { font-size: 16px; font-weight: 700; color: #1c252e; margin-bottom: 5px; }
        .card-subtitle { font-size: 13px; color: #637381; }
        .btn-buy { background: #00ab55; color: white; text-decoration: none; padding: 14px 18px; border-radius: 10px; font-weight: 700; font-size: 15px; text-align: center; display: block; margin-top: 10px; }
        .btn-share { background: #229ed9; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; width: 100%; margin-top: 15px; }
        .footer-trust { text-align: center; font-size: 12px; color: #919eab; margin-top: 30px; padding: 15px; border-top: 1px solid #e7ecf0; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <h1>✈️ Поездки Плюс</h1>
        <p>Ваш личный конструктор путешествий</p>
    </div>

    <div class="card">
        <label>🔥 Популярные направления:</label>
        <div class="quick-chips">
            <div class="chip" onclick="setQuick('Москва', 'Сочи', 5)">🏖️ Отпуск в Сочи</div>
            <div class="chip" onclick="setQuick('Москва', 'Санкт-Петербург', 3)">🏰 Выходные в Питере</div>
            <div class="chip" onclick="setQuick('Москва', 'Дубай', 7)">🐪 Пляжный Дубай</div>
        </div>

        <div class="form-row">
            <div><label>Откуда</label><input type="text" id="fromCity" value="Москва"></div>
            <div><label>Куда</label><input type="text" id="toCity" value="Сочи"></div>
        </div>

        <div class="form-row">
            <div><label>Дата вылета</label><input type="date" id="date"></div>
            <div><label>Ночей</label><input type="number" id="nights" value="5" min="1"></div>
        </div>

        <label>Сервисы</label>
        <div class="services-grid">
            <label class="service-label"><input type="checkbox" id="needFlight" checked> ✈️ Авиабилеты</label>
            <label class="service-label"><input type="checkbox" id="needHotel" checked> 🏨 Отели</label>
            <label class="service-label"><input type="checkbox" id="needTrain"> 🚆 Поезда</label>
            <label class="service-label"><input type="checkbox" id="needCar"> 🚘 Авто</label>
        </div>

        <button class="btn-main" onclick="startSearch()">🔍 Найти лучшее</button>
    </div>

    <div id="results"></div>

    <div id="shareBox" style="display: none;">
        <button class="btn-share" onclick="shareTrip()">📲 Поделиться этой сборкой</button>
    </div>

    <div class="footer-trust">
        🛡️ <b>Поездки Плюс</b> — бесплатный сервис поиска. Все бронирования проходят на официальных сайтах партнеров.
    </div>
</div>

<script>
    document.getElementById('date').valueAsDate = new Date();
    function setQuick(from, to, nights) {
        document.getElementById('fromCity').value = from;
        document.getElementById('toCity').value = to;
        document.getElementById('nights').value = nights;
        startSearch();
    }

    async function startSearch() {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "<div class='card' style='text-align:center;'>⏳ Собираем лучшие варианты для вас...</div>";

        const requestData = {
            from_city: document.getElementById('fromCity').value,
            to_city: document.getElementById('toCity').value,
            date: document.getElementById('date').value,
            nights: parseInt(document.getElementById('nights').value),
            need_flight: document.getElementById('needFlight').checked,
            need_train: document.getElementById('needTrain').checked,
            need_hotel: document.getElementById('needHotel').checked,
            need_car: document.getElementById('needCar').checked
        };

        try {
            const response = await fetch('/api/v1/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(requestData)
            });

            const data = await response.json();
            let html = "";
            if (data.weather) html += `<div class="weather-box">🌡️ <b>Погода:</b> ${data.weather}</div>`;
            
            if (data.flights?.length) data.flights.forEach(f => html += renderCard("🔥 АВИАБИЛЕТЫ", f.title, f.details, f.url, "Забронировать ➔"));
            if (data.hotels?.length) data.hotels.forEach(h => html += renderCard("🏨 ОТЕЛИ", h.title, h.details, h.url, "Выбрать номер ➔"));
            if (data.trains?.length) data.trains.forEach(t => html += renderCard("🚆 ПОЕЗДА", t.title, t.details, t.url, "Расписание ➔"));
            if (data.cars?.length) data.cars.forEach(c => html += renderCard("🚘 АВТО", c.title, c.details, c.url, "Забронировать ➔"));

            resultsDiv.innerHTML = html;
            document.getElementById('shareBox').style.display = 'block';
        } catch (err) {
            resultsDiv.innerHTML = "<div class='card' style='color:red; text-align:center;'>Ошибка сервера.</div>";
        }
    }

    function renderCard(badge, title, details, url, btnText) {
        return `
            <div class="result-card">
                <span class="badge-deal">${badge}</span>
                <div class="card-title">${title}</div>
                <div class="card-subtitle">${details}</div>
                <a href="${url}" target="_blank" class="btn-buy">${btnText}</a>
            </div>`;
    }

    function shareTrip() {
        const text = `✈️ Поездки Плюс: Собрал маршрут ${document.getElementById('fromCity').value} ➔ ${document.getElementById('toCity').value}!`;
        if (navigator.share) navigator.share({ title: 'Поездки Плюс', text: text, url: window.location.href });
        else alert('Ссылка скопирована!');
    }
</script>
</body>
</html>
